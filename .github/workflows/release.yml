name: Build and Release AccountManager

on:
  # Lancement manuel possible
  workflow_dispatch:
  # Lancement auto quand un tag vX.Y.Z est poussé
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write  # needed to create a GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE with PyInstaller (spec file)
        shell: bash
        run: |
          pyinstaller AccountManager.spec

      - name: Verify built EXE exists
        shell: bash
        run: |
          if [ ! -f "dist/AccountManager.exe" ]; then
            echo "dist/AccountManager.exe not found" >&2
            exit 1
          fi

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis -y

      - name: Set version from tag into NSIS
        id: version
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) {
            Write-Error "Tag name must start with 'v', got '$tag'"
          }
          $version = $tag.Substring(1)
          Write-Host "Using tag $tag with version $version"

          $path = 'installer/account_manager.nsi'
          if (-not (Test-Path $path)) {
            Write-Error "NSIS script not found at $path"
          }

          $content = Get-Content $path -Raw
          $pattern = '!define APP_VERSION\s+"[^"]+"'
          if ($content -notmatch $pattern) {
            Write-Error 'APP_VERSION define not found in NSIS script'
          }
          $replacement = "!define APP_VERSION \"$version\""
          $newContent = [System.Text.RegularExpressions.Regex]::Replace($content, $pattern, $replacement)
          Set-Content -Path $path -Value $newContent -Encoding UTF8

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build installer with NSIS
        shell: powershell
        run: |
          makensis installer\account_manager.nsi

      - name: Verify installer exists
        shell: bash
        run: |
          if [ ! -f "installer/AccountManagerSetup.exe" ]; then
            echo "installer/AccountManagerSetup.exe not found" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: Release ${{ steps.version.outputs.tag }}
          files: |
            dist/AccountManager.exe
            installer/AccountManagerSetup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
